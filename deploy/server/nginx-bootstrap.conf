# Plain-HTTP config used until the zerocarbonx.cn certificate exists (deploy/publish.sh --nginx picks it).
server_tokens off;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zerocarbonx.cn www.zerocarbonx.cn _;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    include /etc/nginx/snippets/grenn-site.conf;
}
