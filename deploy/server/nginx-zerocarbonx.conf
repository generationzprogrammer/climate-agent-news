# zerocarbonx.cn — static site from /srv/grenn/current (frontend release + data/ → synced data snapshot).
# Installed as /etc/nginx/sites-available/zerocarbonx by deploy/publish.sh --nginx (once the certificate exists;
# before that nginx-bootstrap.conf serves plain HTTP). Certificates: certbot certonly --webroot, renewed by certbot.timer.

server_tokens off;

# Plain HTTP: certificate challenges, then everything goes to https://zerocarbonx.cn
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zerocarbonx.cn www.zerocarbonx.cn _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://zerocarbonx.cn$request_uri; }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerocarbonx.cn;
    ssl_certificate     /etc/letsencrypt/live/zerocarbonx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerocarbonx.cn/privkey.pem;
    return 301 https://zerocarbonx.cn$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name zerocarbonx.cn;
    ssl_certificate     /etc/letsencrypt/live/zerocarbonx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerocarbonx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    # set here only: an add_header inside a location would drop these (nginx inheritance), so caching uses expires
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/grenn-site.conf;
}
