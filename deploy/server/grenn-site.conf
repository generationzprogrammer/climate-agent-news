# Shared site body for the zerocarbonx.cn server blocks (installed as /etc/nginx/snippets/grenn-site.conf).
root /srv/grenn/current;
index index.html;
charset utf-8;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/x-ndjson image/svg+xml text/plain text/csv text/markdown;

# the home page is the COP31 edition; the main site stays at /index.html
location = / { return 302 /cop31/; }
location / { try_files $uri $uri/ =404; expires -1; }
# pages and data change in place: always revalidate (ETag / Last-Modified)
location ~* \.jsonl$ { default_type application/x-ndjson; expires -1; }
location ~* \.md$ { default_type text/markdown; expires -1; }
# scripts and styles carry ?v= versions; images rarely change
location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ { expires 1d; }
location ~ /\. { deny all; }

# news database downloads (deploy/newsdb): public/ links to the latest export and is switched atomically after each update
location ^~ /downloads/ {
    alias /srv/grenn/newsdb/public/;
    expires -1;
    charset_types text/plain text/csv application/json application/x-ndjson;
    types { application/json json; application/x-ndjson jsonl; text/csv csv; text/plain txt; application/zip zip; }
    default_type application/octet-stream;
}
