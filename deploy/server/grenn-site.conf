# Shared site body for the zerocarbonx.cn server blocks (installed as /etc/nginx/snippets/grenn-site.conf).
root /srv/grenn/current;
index index.html;
charset utf-8;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/x-ndjson image/svg+xml text/plain text/csv text/markdown;
# brotli (libnginx-mod-http-brotli-*, publish.sh --setup; 2026-11-07): about a third smaller than gzip for the JSON. A
# precompressed .br / .gz beside a file (sync-data.sh writes them for data/, the news database for its index) is sent as it is.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/css application/javascript application/json application/x-ndjson image/svg+xml text/plain text/csv text/markdown;
brotli_static on;
gzip_static on;

# the home page is the COP31 edition; the main site stays at /index.html
location = / { return 302 /cop31/; }
location / { try_files $uri $uri/ =404; expires -1; }
# pages and data change in place: always revalidate (ETag / Last-Modified)
location ~* \.jsonl$ { default_type application/x-ndjson; expires -1; }
location ~* \.md$ { default_type text/markdown; expires -1; }
# 全球事件地图 (static/cop31/atlas, 2026-11-10): its ES modules import each other by plain relative paths (no ?v=), so they
# are revalidated every time (304 when unchanged); its libraries (vendor/), textures and outlines keep the 7 days below
location ~ ^/cop31/atlas/[^/]+\.(?:js|css)$ { expires -1; }
# scripts and styles carry ?v= versions (a new version is a new address); images rarely change (2026-11-07: 1 → 7 days)
location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ { expires 7d; }
location ~ /\. { deny all; }

# weekly-briefing subscriptions (deploy/subscriptions, 2026-11-06): the original Cloudflare service rejects this origin
# and is unreachable from mainland China, so the form posts here; the list stays in /srv/grenn/subscriptions
location = /data/subscription.json { alias /srv/grenn/conf/subscription.json; default_type application/json; expires -1; }
location ^~ /api/subscriptions/ {
    limit_req zone=grenn_subscriptions burst=20 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8796/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# research index API (deploy/research, 2026-11-13; the 功能更新1113 handover): topics / report timeline / reviewed
# positions for 研究工具. Read-only, same origin, rate-limited; the service listens on loopback only and has no
# full-text endpoint (the texts stay in /srv/grenn/newsdb, outside the web root)
location ^~ /api/research/ {
    limit_req zone=grenn_research burst=40 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8797;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# news database downloads (deploy/newsdb): public/ links to the latest export and is switched atomically after each update
location ^~ /downloads/ {
    alias /srv/grenn/newsdb/public/;
    expires -1;
    charset_types text/plain text/csv application/json application/x-ndjson;
    types { application/json json; application/x-ndjson jsonl; text/csv csv; text/plain txt; application/zip zip; application/gzip gz; }
    default_type application/octet-stream;
}

# the research group's full-text datasets (deploy/newsdb `ingest-group`): research copies without redistribution
# rights, so group account only (one shared login, created by publish.sh --setup; password in /root/grenn-datasets-credentials.txt)
location = /datasets { return 301 /datasets/; }
location ^~ /datasets/ {
    auth_basic "GRENN group datasets";
    auth_basic_user_file /etc/nginx/grenn-datasets.htpasswd;
    alias /srv/grenn/newsdb/group/current/protected/;
    index index.html;
    expires -1;
    charset_types text/plain application/json;
    types { text/html html; application/json json; text/plain txt; application/zip zip; application/gzip gz; }
    default_type application/octet-stream;
}
