# http-level limits for the zerocarbonx.cn site (installed as /etc/nginx/conf.d/grenn-limits.conf by deploy/publish.sh --setup)
limit_req_zone $binary_remote_addr zone=grenn_subscriptions:1m rate=30r/m;
# research index API (deploy/research): a page of the research tools asks two or three times per click
limit_req_zone $binary_remote_addr zone=grenn_research:2m rate=180r/m;
