[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-text-lab"
version = "0.2.0"
description = "每日更新、来源可追溯的国际气候情报与高质量中文文本数据库"
requires-python = ">=3.11"
dependencies = ["opencc-python-reimplemented>=0.1.7", "beautifulsoup4==4.12.3", "lxml==5.3.0", "reportlab>=4.2,<5"]

[project.scripts]
climate-brief = "climate_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
