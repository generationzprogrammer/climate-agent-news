name: 科产融合每周资料更新
on:
  workflow_dispatch:
  schedule:
    # Sunday 15:20 UTC = Sunday 23:20 Beijing; daily export follows at 06:30.
    - cron: '20 15 * * 0'
permissions:
  contents: write
concurrency:
  group: climate-text-pages
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装结构化名录解析依赖
        run: python -m pip install --disable-pip-version-check -e .
      - name: 校验并增量收录官方案例
        run: python scripts/update_innovation_registries.py --refresh --max-add 36 --per-country 12
      - name: 重建案例统计与图表
        run: |
          python scripts/build_innovation_cases.py
          python scripts/build_innovation_live_figures.py
          python -m unittest discover -s tests -p 'test_innovation_registry*.py' -v
      - name: 增量监测官方来源并保存候选资料
        run: python scripts/update_innovation_watch.py --max-pages 16
      - name: 保存监测记录
        shell: bash
        run: |
          git config user.name climate-text-bot
          git config user.email climate-text-bot@users.noreply.github.com
          git add config/open_innovation_registries.json data/innovation_registry_update.json data/innovation_registry_history.json data/innovation_watch.json static/data/innovation_cases.json static/data/innovation_update.json static/innovation/assets/coverage-latest.svg
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly innovation source observations [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - name: 保存本次校验结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innovation-registry-audit
          path: data/innovation_registry_update.json
          retention-days: 30
