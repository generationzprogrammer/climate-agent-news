name: Recover BTH policy archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bth-policy-recover-20260923.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: climate-text-pages
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Download the 40 completed collection batches
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: generationzprogrammer/climate-agent-news
          run-id: 35810665165
          pattern: bth-policy-*
          path: policy-batches
          merge-multiple: true
      - name: Merge policy archive
        env:
          PYTHONPATH: src
        run: python -m climate_agent.cli merge-bth-policies --input-dir policy-batches --output data/bth_policy_archive.json
      - name: Save archive and trigger site deployment
        shell: bash
        run: |
          git config user.name "climate-text-bot"
          git config user.email "climate-text-bot@users.noreply.github.com"
          git add data/bth_policy_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "data: recover BTH green-transition policy archive"
            git pull --rebase origin main
            git push origin main
          fi
