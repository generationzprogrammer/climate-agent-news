name: 每日更新气候文本数据平台

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/news_archive.json"
      - "data/source_health.json"
  workflow_dispatch:
    inputs:
      send_notification:
        description: "部署成功后发送企业微信或邮件提醒"
        required: false
        default: false
        type: boolean
      send_weekly:
        description: "部署成功后发送周报邮件"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub Actions cron 使用 UTC；22:30 UTC = 北京时间次日 06:30。
    - cron: "30 22 * * *"
    # 每周一北京时间 08:00 自动生成并发送上一周周报。
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: climate-text-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码与上一版档案
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 增量采集、中文编译与质量门禁
        env:
          PYTHONPATH: src
          CLIMATE_ARCHIVE_LIMIT: "100000"
          CLIMATE_MAX_STALE_DAYS: "2"
          # Code pushes run a one-time wider translation pass so newly added
          # regional sources can repair the current seven-day balance. The
          # scheduled daily job returns to the normal 20-record budget.
          CLIMATE_TRANSLATION_LIMIT: ${{ github.event_name == 'push' && '40' || '20' }}
          # GitHub Models 已于 2026-07-30 退役。默认迁移到 Gemini
          # OpenAI 兼容接口；GEMINI_API_KEY 仅保存在仓库 Secret 中。
          CLIMATE_MODEL_BASE_URL: ${{ secrets.CLIMATE_MODEL_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          CLIMATE_MODEL_API_KEY: ${{ secrets.CLIMATE_MODEL_API_KEY || secrets.GEMINI_API_KEY }}
          CLIMATE_MODEL_NAME: ${{ secrets.CLIMATE_MODEL_NAME || 'gemini-3.5-flash-lite' }}
          CLIMATE_SUBSCRIBE_ENDPOINT: ${{ secrets.CLIMATE_SUBSCRIBE_ENDPOINT }}
          CLIMATE_UNSUBSCRIBE_ENDPOINT: ${{ secrets.CLIMATE_UNSUBSCRIBE_ENDPOINT }}
          CLIMATE_PUBLIC_CONTACT_EMAIL: ${{ secrets.CLIMATE_PUBLIC_CONTACT_EMAIL }}
          CLOUDFLARE_WEB_ANALYTICS_SITE_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          CLIMATE_SITE_HOSTNAME: generationzprogrammer.github.io
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -m climate_agent.cli init
          python -m climate_agent.cli update-visitors
          python -m climate_agent.cli sync --skip-ndc
          python -m climate_agent.cli export-web --output site --archive-limit 100000
          python -m climate_agent.cli validate-publish --site site
          cp site/data/news_archive.json data/news_archive.json
      - name: 保存滚动档案与来源健康状态
        shell: bash
        run: |
          git config user.name "climate-text-bot"
          git config user.email "climate-text-bot@users.noreply.github.com"
          git add data/climate.db data/news_archive.json data/source_health.json
          if [ -f data/visitor_history.json ]; then
            git add data/visitor_history.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: daily climate text archive [skip ci]"
            git push
          fi
      - name: 保存本次合格发布快照
        uses: actions/upload-artifact@v4
        with:
          name: daily-publish-snapshot
          path: site/data
          retention-days: 14
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: ${{ github.event.schedule == '30 22 * * *' || inputs.send_notification == true }}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取本次合格快照
        uses: actions/download-artifact@v4
        with:
          name: daily-publish-snapshot
          path: site/data
      - name: 发送三条重点提醒
        env:
          PYTHONPATH: src
          CLIMATE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          CLIMATE_WECOM_WEBHOOK_URL: ${{ secrets.CLIMATE_WECOM_WEBHOOK_URL }}
          CLIMATE_MAIL_TO: ${{ secrets.CLIMATE_MAIL_TO }}
          CLIMATE_SMTP_HOST: ${{ secrets.CLIMATE_SMTP_HOST }}
          CLIMATE_SMTP_PORT: ${{ secrets.CLIMATE_SMTP_PORT }}
          CLIMATE_SMTP_SECURITY: ${{ secrets.CLIMATE_SMTP_SECURITY }}
          CLIMATE_SMTP_USERNAME: ${{ secrets.CLIMATE_SMTP_USERNAME }}
          CLIMATE_SMTP_PASSWORD: ${{ secrets.CLIMATE_SMTP_PASSWORD }}
          CLIMATE_SMTP_SENDER: ${{ secrets.CLIMATE_SMTP_SENDER }}
        run: python -m climate_agent.cli deliver --snapshot site/data/dashboard.json --channel auto --public-url "$CLIMATE_PUBLIC_URL" --max-items 3

  weekly_notify:
    if: ${{ github.event.schedule == '0 0 * * 1' || inputs.send_weekly == true }}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取本次合格快照
        uses: actions/download-artifact@v4
        with:
          name: daily-publish-snapshot
          path: site/data
      - name: 发送周报邮件
        env:
          PYTHONPATH: src
          CLIMATE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          CLIMATE_WEEKLY_SUBSCRIBERS: ${{ secrets.CLIMATE_WEEKLY_SUBSCRIBERS }}
          CLIMATE_SMTP_HOST: ${{ secrets.CLIMATE_SMTP_HOST }}
          CLIMATE_SMTP_PORT: ${{ secrets.CLIMATE_SMTP_PORT }}
          CLIMATE_SMTP_SECURITY: ${{ secrets.CLIMATE_SMTP_SECURITY }}
          CLIMATE_SMTP_USERNAME: ${{ secrets.CLIMATE_SMTP_USERNAME }}
          CLIMATE_SMTP_PASSWORD: ${{ secrets.CLIMATE_SMTP_PASSWORD }}
          CLIMATE_SMTP_SENDER: ${{ secrets.CLIMATE_SMTP_SENDER }}
        run: python -m climate_agent.cli deliver-weekly --snapshot site/data/weekly_report.json --channel auto --public-url "$CLIMATE_PUBLIC_URL"
